<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">Acronox — Alexis Baret</title>
  <desc id="desc">Editorial banner for Acronox's GitHub profile</desc>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #FAFAF7;
      --surface: #FFFFFF;
      --text: #111110;
      --secondary: #4A4843;
      --accent: #D8C7A3;
      --accent-bg: #EFE6D3;
      --line: #DEDAD1;
    }
    .bg { fill: var(--bg); }
    .surface { fill: var(--surface); }
    .accent { fill: var(--accent); }
    .accent-bg { fill: var(--accent-bg); }
    .line { stroke: var(--line); }
    .text { fill: var(--text); }
    .secondary { fill: var(--secondary); }
    text { font-family: "IBM Plex Serif", "Source Serif 4", Georgia, serif; }
    .sans { font-family: "IBM Plex Sans", Arial, sans-serif; }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111110;
        --surface: #4A4843;
        --text: #F1EFEA;
        --secondary: #A8A49C;
        --accent: #CDB88E;
        --accent-bg: #2A251C;
        --line: #2B2A27;
      }
    }
  </style>

  <rect class="bg" width="1200" height="440" rx="8"/>
  <rect class="surface" x="28" y="28" width="1144" height="384" rx="4"/>
  <rect class="accent-bg" x="28" y="28" width="274" height="384"/>
  <line class="line" x1="302" y1="28" x2="302" y2="412"/>
  <line class="line" x1="332" y1="104" x2="1138" y2="104"/>
  <line class="line" x1="332" y1="338" x2="1138" y2="338"/>

  <circle class="accent" cx="165" cy="166" r="94"/>
  <text class="text" x="165" y="199" text-anchor="middle" font-size="108" font-weight="700" letter-spacing="-10">A/</text>
  <text class="secondary sans" x="76" y="322" font-size="12" letter-spacing="2.4">ENGINEERING STUDENT</text>
  <text class="secondary sans" x="76" y="348" font-size="12" letter-spacing="2.4">BREST, FRANCE</text>
  <text class="text sans" x="76" y="382" font-size="11" letter-spacing="1.4">48.3904° N · 4.4861° W</text>

  <text class="secondary sans" x="334" y="72" font-size="12" letter-spacing="2.2">ALEXIS BARET · SELECTED PROFILE</text>
  <text class="secondary sans" x="1138" y="72" text-anchor="end" font-size="12" letter-spacing="2.2">VOL. 21</text>

  <text class="text" x="328" y="239" font-size="122" font-weight="700" letter-spacing="-7">Acronox</text>
  <rect class="accent" x="1019" y="134" width="119" height="119" rx="60"/>
  <text class="text" x="1078.5" y="211" text-anchor="middle" font-size="62" font-weight="600">*</text>

  <text class="secondary" x="334" y="288" font-size="22" font-style="italic">I build to understand — and understand to build better.</text>

  <text class="text sans" x="334" y="376" font-size="12" letter-spacing="1.7">SOFTWARE</text>
  <circle class="accent" cx="456" cy="372" r="4"/>
  <text class="text sans" x="478" y="376" font-size="12" letter-spacing="1.7">WEB</text>
  <circle class="accent" cx="541" cy="372" r="4"/>
  <text class="text sans" x="563" y="376" font-size="12" letter-spacing="1.7">DATA</text>
  <text class="secondary sans" x="1138" y="376" text-anchor="end" font-size="11" letter-spacing="1.4">ACRONOXX.GITHUB.IO ↗</text>
</svg>
