<svg xmlns="http://www.w3.org/2000/svg" width="180" height="42" viewBox="0 0 180 42" role="img" aria-label="Visit my portfolio">
  <style>
    :root { color-scheme: light dark; --bg:#FAFAF7; --text:#111110; --line:#D8C7A3; }
    @media (prefers-color-scheme: dark) { :root { --bg:#111110; --text:#F1EFEA; --line:#CDB88E; } }
    text { font-family:"IBM Plex Serif",Georgia,serif; }
  </style>
  <rect width="180" height="42" fill="var(--bg)"/>
  <line x1="0" y1="40.5" x2="180" y2="40.5" stroke="var(--line)" stroke-width="2"/>
  <text x="6" y="26.5" fill="var(--text)" font-size="14" font-weight="600">Visit my portfolio</text>
  <text x="163" y="26.5" text-anchor="end" fill="var(--text)" font-size="15">↗</text>
</svg>
